# Competition-mode profile (Improvement #20).
#
# Usage: load this AFTER marker_detection.yaml so it only overrides the fields
# below (ros2 launch does not merge YAML files; pass this as the sole
# --params-file for a competition run, or merge the two files into one before
# the run -- see README.md "Competition mode").
#
# This changes bandwidth/CPU/logging behavior only. It does not relax any
# pose-quality, tracking, or safety threshold: a system under uncertainty
# should still report that uncertainty, not just stop telling you about it.
marker_detection:
  ros__parameters:
    competition_mode: true
    publish_debug_image: false
    publish_3d_debug_image: false
    publish_pose_debug_image: false
    publish_tracking_debug_image: false
    show_debug_info: false
    draw_pose_axes: false
    # Diagnostics remain on: they are a handful of scalars per second, not images.
    publish_diagnostics: true
    diagnostic_rate_hz: 1.0
