marker_detection:
  ros__parameters:
    rgb_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    debug_image_topic: "/marker_detection/debug_image"
    detection_topic: "/marker_detections"
    marker_3d_detection_topic: "/marker_3d_detections"
    raw_pose_topic: "/marker_poses_raw"
    marker_pose_topic: "/marker_poses"
    aruco_dictionary: "DICT_6X6_250"
    use_clahe: false
    clahe_clip_limit: 2.0
    clahe_tile_grid_size: 8
    sync_queue_size: 10
    sync_slop: 0.05
    min_marker_size_px: 10.0
    min_marker_area_px: 50.0
    min_distance_to_border: 5
    publish_debug_image: true
    show_debug_info: true
    allowed_marker_ids: []
    # Applied only to 16UC1. Verify this with the active RealSense driver configuration.
    depth_scale: 0.001
    min_depth_m: 0.15
    max_depth_m: 10.0
    depth_roi_shrink_ratio: 0.20
    min_valid_depth_samples: 20
    depth_outlier_method: "mad"
    depth_outlier_threshold: 3.0
    # Floor for the depth-median variance estimate (Improvement #3), guards against
    # over-confident fusion when MAD collapses to ~0 on very clean/quantized depth.
    min_depth_variance_m2: 1.0e-6
    publish_3d_debug_image: true
    debug_3d_image_topic: "/marker_detection/3d_debug_image"
    max_depth_processing_time_ms: 20.0

    # Side length in metres, measured across the printed marker's outer black border.
    # Fallback used for any marker ID not listed in per_marker_size_ids below.
    marker_size_m: 0.10
    # Improvement #21: per-marker physical size overrides. Parallel arrays; set
    # use_per_marker_sizes: true and list every marker ID whose size differs from
    # marker_size_m above. Example: markers 1 and 2 are 0.10 m, marker 7 is 0.15 m ->
    #   use_per_marker_sizes: true
    #   per_marker_size_ids: [7]
    #   per_marker_size_values: [0.15]
    use_per_marker_sizes: false
    per_marker_size_ids: [0]
    per_marker_size_values: [0.10]

    solvepnp_method: "IPPE_SQUARE"
    max_reprojection_error_px: 3.0
    min_marker_depth_m: 0.15
    max_marker_depth_m: 10.0
    validate_against_depth: true
    max_depth_position_difference_m: 0.20
    publish_pose_debug_image: true
    pose_debug_image_topic: "/marker_detection/pose_debug_image"
    publish_euler_angles: true
    draw_pose_axes: true

    # --- Improvement #1: robust multi-candidate planar-pose selection ---
    max_viewing_angle_deg: 75.0          # Hard reject beyond this (pose is numerically ill-conditioned).
    high_viewing_angle_warn_deg: 60.0    # Soft HIGH_VIEWING_ANGLE flag beyond this.
    high_reprojection_warn_px: -1.0      # -1 = auto (66% of max_reprojection_error_px).
    depth_mismatch_quality_threshold: 0.5
    ambiguity_score_margin: 0.05         # Top-2 candidate scores closer than this -> POSE_AMBIGUOUS.
    candidate_weight_reprojection: 0.35
    candidate_weight_geometry: 0.15
    candidate_weight_depth: 0.15
    candidate_weight_temporal_position: 0.20
    candidate_weight_temporal_orientation: 0.10
    candidate_weight_viewing_angle: 0.05

    # --- Improvement #3: pose-measurement covariance (not a fixed constant) ---
    pnp_lateral_uncertainty_px: 1.0      # Assumed ArUco corner-localization noise, in pixels.
    pnp_z_uncertainty_ratio: 0.03        # Fractional Z uncertainty at range (monocular planar-PnP heuristic).
    min_position_variance_m2: 1.0e-6

    # --- Improvement #10: dt-aware outlier rejection (shared with the temporal candidate-scoring terms) ---
    position_jump_tolerance_m: 0.05
    max_linear_velocity_mps: 2.0
    orientation_jump_tolerance_deg: 10.0
    max_angular_velocity_dps: 180.0

    # --- Improvement #7: 2D image-quality gating (blur / contrast / geometry), independent of pose/depth ---
    min_blur_score: 15.0            # Below this: LOW_IMAGE_QUALITY flag (still used).
    min_blur_score_hard: 3.0        # Below this: hard rejected, too blurred to trust at all.
    min_contrast_score: 8.0
    min_contrast_score_hard: 2.0
    max_side_length_cv: 0.35        # Coefficient of variation of the 4 side lengths; higher = more skewed quad.
    image_quality_shrink_ratio: 0.15
    min_pose_quality_marker_size_px: 20.0   # Stricter than min_marker_size_px (detection-only minimum).

    # --- Improvement #5: time-aware tracking (elapsed wall-clock time, not frame counts) ---
    min_confirmations: 3                # Detections required within confirmation_window_seconds.
    confirmation_window_seconds: 1.0
    degraded_after_seconds: 0.5         # One/a few missed frames within this window: track stays CONFIRMED.
    lost_timeout_seconds: 1.5           # Beyond degraded_after but within this: DEGRADED.
    track_timeout_seconds: 5.0          # Beyond this since the last detection: track is deleted.
    position_process_noise: 0.5
    position_measurement_noise: 0.01
    position_initial_covariance: 0.1
    orientation_alpha: 0.25
    innovation_gate_threshold: 11.34
    max_orientation_innovation_deg: 45.0
    tracking_max_reprojection_error_px: 3.0
    tracking_debug_image_topic: "/marker_tracking/debug_image"
    publish_tracking_debug_image: true

    # --- Improvement #20: competition vs development mode ---
    # true disables all *_debug_image publishers and drops periodic stats logging to DEBUG level.
    # See marker_detection_competition.yaml for a ready-to-use competition profile.
    competition_mode: false

    # --- Improvement #14/#15: diagnostics and performance reporting ---
    publish_diagnostics: true
    diagnostics_topic: "/marker_detection/diagnostics"
    diagnostic_rate_hz: 1.0
    latency_warn_p95_ms: 40.0
    latency_error_p95_ms: 100.0
    sync_stale_warn_s: 1.0

    adaptiveThreshWinSizeMin: 3
    adaptiveThreshWinSizeMax: 23
    adaptiveThreshWinSizeStep: 10
    adaptiveThreshConstant: 7.0
    minMarkerPerimeterRate: 0.03
    maxMarkerPerimeterRate: 4.0
    polygonalApproxAccuracyRate: 0.03
    minCornerDistanceRate: 0.05
    minDistanceToBorder: 3
    perspectiveRemovePixelPerCell: 4
    perspectiveRemoveIgnoredMarginPerCell: 0.13
    maxErroneousBitsInBorderRate: 0.35
    errorCorrectionRate: 0.6

    # --- Part 10: optional single CLAHE-enhanced fallback detection pass ---
    # Only ever runs when the primary pass finds zero markers; disabled by
    # default so behavior is unchanged unless explicitly enabled.
    use_adaptive_multiscale_detection: false
