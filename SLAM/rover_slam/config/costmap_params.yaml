# costmap_params.yaml Configuration for nav2_costmap_2d
costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: false
    robot_radius: 0.4
    resolution: 0.05
    width: 40
    height: 40
    origin_x: -20.0
    origin_y: -20.0
    track_unknown_space: true
    always_send_full_costmap: true
    transform_tolerance: 10.0
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      transform_tolerance: 10.0
      observation_sources: rock_obstacles
      rock_obstacles:
        topic: /perception/obstacles_only
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: "PointCloud2"

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.75

costmap_lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    node_names: ['costmap']
