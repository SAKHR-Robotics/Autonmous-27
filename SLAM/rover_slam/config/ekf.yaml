# ekf.yaml Configuration for robot_localization
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom  # Local EKF outputs odom -> base_link ONLY

    # Wheel Encoder Input (Linear velocity X, Y, Yaw velocity)
    odom0: /wheel/odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # IMU Input (Orientation Yaw, Angular Z, Accelerations)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,  # Yaw
                  false, false, false,
                  false, false, true,  # Angular Z
                  true,  true,  false] # Acceleration X, Y
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
