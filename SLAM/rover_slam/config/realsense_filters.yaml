# ROS 2 RealSense wrapper settings; verify supported profiles on your device.
# One physical driver serves both SLAM and Perception. External /imu/data is
# independent; D435 has no IMU. Do not silently change the fusion IMU source.
/**:
  ros__parameters:
    camera_name: camera
    enable_depth: true
    enable_color: true
    enable_sync: true
    align_depth.enable: true
    enable_accel: false
    enable_gyro: false
    depth_module.depth_profile: "640x480x30"
    rgb_camera.color_profile: "640x480x30"
    pointcloud.enable: true
    pointcloud.ordered_pc: false
    spatial_filter.enable: true
    temporal_filter.enable: true
    decimation_filter.enable: false
    # Interpolated depth is unsuitable as direct evidence of free space.
    hole_filling_filter.enable: false
    clip_distance: 4.0
